<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Icône de Gestion locative : calendrier + maison, dégradé rose → violet (thème Scan-Online) -->
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF3D7F"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="reflet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="maison" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF3D7F"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="ombre" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#1E1440" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Fond arrondi -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#fond)"/>
  <path d="M64 8h128a56 56 0 0 1 56 56v24c-60 20-180 20-240 0V64A56 56 0 0 1 64 8z" fill="url(#reflet)"/>

  <!-- Calendrier -->
  <g filter="url(#ombre)">
    <rect x="48" y="62" width="160" height="150" rx="22" fill="#FFFFFF"/>
  </g>
  <path d="M70 62h116a22 22 0 0 1 22 22v18H48V84a22 22 0 0 1 22-22z" fill="#1E1440"/>
  <!-- Anneaux -->
  <rect x="84" y="44" width="18" height="38" rx="9" fill="#FFFFFF" stroke="#1E1440" stroke-width="6"/>
  <rect x="154" y="44" width="18" height="38" rx="9" fill="#FFFFFF" stroke="#1E1440" stroke-width="6"/>

  <!-- Maison -->
  <path d="M128 112 L178 154 a6 6 0 0 1 -4 10.5 H168 V188 a8 8 0 0 1 -8 8 H96 a8 8 0 0 1 -8 -8 V164.5 H82 a6 6 0 0 1 -4 -10.5 Z"
        fill="url(#maison)" stroke="url(#maison)" stroke-width="6" stroke-linejoin="round"/>
  <rect x="117" y="160" width="22" height="36" rx="5" fill="#FFFFFF"/>
</svg>
